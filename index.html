<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Interior Suggestion System (AR)</title>
  <!-- Load Google Model Viewer for AR -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 650px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .range-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .item-card {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    @media (max-width: 520px) {
      .item-card { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-high { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-mid { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

    .item-info h3 {
      font-size: 1.05rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .specs {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .explanation {
      font-size: 0.8rem;
      color: var(--text);
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .viewer-box {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    .ar-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      position: absolute;
      bottom: 6px;
      right: 6px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Interior Suggestion System</h1>
    <p>Minimalistic Space Recommendation & AR Visualization</p>
  </header>

  <div class="container">
    <!-- Left Input Controls -->
    <div class="card">
      <form id="recommendForm">
        <div class="form-group">
          <label>Available Floor Space (cm)</label>
          <div class="range-inputs">
            <div>
              <label style="font-size: 0.75rem;">Width (cm)</label>
              <input type="number" id="width" class="form-control" value="150" min="40" max="400" required>
            </div>
            <div>
              <label style="font-size: 0.75rem;">Depth (cm)</label>
              <input type="number" id="depth" class="form-control" value="85" min="40" max="400" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" class="form-control">
            <option value="sofa">Sofa / Couch</option>
            <option value="chair">Chair</option>
            <option value="desk">Desk / Table</option>
          </select>
        </div>

        <div class="form-group">
          <label for="style">Style Preference</label>
          <select id="style" class="form-control">
            <option value="modern">Modern</option>
            <option value="minimalist">Minimalist</option>
            <option value="classic">Classic</option>
          </select>
        </div>

        <button type="submit" class="btn">Get AI Suggestions</button>
      </form>
    </div>

    <!-- Right Results Panel -->
    <div class="card">
      <h2 style="font-size: 1.15rem; margin-bottom: 14px;">Recommended Furniture</h2>
      <div id="recommendationList">
        <div class="empty-state">Select dimensions and click <strong>Get AI Suggestions</strong>.</div>
      </div>
    </div>
  </div>

  <script>
    // Minimalist 3D Catalog with DISTINCT Real 3D Models for Each Category!
    const catalog = [
      // SOFAS
      {
        id: 1,
        name: "Modern Glam Velvet Sofa",
        category: "sofa",
        width_cm: 150,
        depth_cm: 85,
        height_cm: 80,
        min_clearance_cm: 40,
        style: "modern",
        color: "grey",
        model_url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/GlamVelvetSofa/glTF-Binary/GlamVelvetSofa.glb"
      },
      {
        id: 2,
        name: "Minimalist Leather Loveseat",
        category: "sofa",
        width_cm: 130,
        depth_cm: 75,
        height_cm: 78,
        min_clearance_cm: 35,
        style: "minimalist",
        color: "brown",
        model_url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenWoodLeatherSofa/glTF-Binary/SheenWoodLeatherSofa.glb"
      },

      // CHAIRS
      {
        id: 3,
        name: "Scandinavian Modern Dining Chair",
        category: "chair",
        width_cm: 65,
        depth_cm: 65,
        height_cm: 85,
        min_clearance_cm: 25,
        style: "modern",
        color: "wood",
        model_url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb"
      },
      {
        id: 4,
        name: "Classic Purplegold Armchair",
        category: "chair",
        width_cm: 85,
        depth_cm: 80,
        height_cm: 90,
        min_clearance_cm: 35,
        style: "classic",
        color: "gold",
        model_url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ChairDamaskPurplegold/glTF-Binary/ChairDamaskPurplegold.glb"
      },

      // DESKS / TABLES
      {
        id: 5,
        name: "Compact Wooden Study Desk",
        category: "desk",
        width_cm: 110,
        depth_cm: 55,
        height_cm: 75,
        min_clearance_cm: 30,
        style: "minimalist",
        color: "wood",
        model_url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb"
      }
    ];

    // Minimalist, Easy-to-Explain AI Recommendation Logic
    function getRecommendations(availableWidth, availableDepth, category, preferredStyle) {
      // 1. Spatial Pruning: Discard furniture that physically doesn't fit
      let fitting = catalog.filter(item => {
        if (category && item.category !== category) return false;
        return item.width_cm <= availableWidth && item.depth_cm <= availableDepth;
      });

      // 2. Simple Scoring: Spatial Clearance (60%) + Style Match (40%)
      let scored = fitting.map(item => {
        let clearance = ((availableWidth - item.width_cm) + (availableDepth - item.depth_cm)) / 2;
        let spatialScore = clearance >= item.min_clearance_cm ? 1.0 : (clearance / item.min_clearance_cm);
        let styleScore = (item.style === preferredStyle) ? 1.0 : 0.4;

        let totalScore = Math.round((0.60 * spatialScore + 0.40 * styleScore) * 100);

        return {
          ...item,
          match_score: totalScore,
          clearance: Math.round(clearance)
        };
      });

      // 3. Sort by highest score
      scored.sort((a, b) => b.match_score - a.match_score);
      return scored;
    }

    document.getElementById('recommendForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const width = parseFloat(document.getElementById('width').value);
      const depth = parseFloat(document.getElementById('depth').value);
      const category = document.getElementById('category').value;
      const style = document.getElementById('style').value;

      const results = getRecommendations(width, depth, category, style);
      const container = document.getElementById('recommendationList');

      if (results.length > 0) {
        container.innerHTML = '';
        results.forEach((item, index) => {
          const badgeClass = item.match_score >= 75 ? 'badge-high' : 'badge-mid';
          container.innerHTML += `
            <div class="item-card">
              <div class="item-info">
                <span class="badge ${badgeClass}">Match: ${item.match_score}%</span>
                <h3>#${index + 1} ${item.name}</h3>
                <div class="specs">
                  <strong>Dimensions:</strong> ${item.width_cm}cm (W) × ${item.depth_cm}cm (D)<br>
                  <strong>Style:</strong> ${item.style}
                </div>
                <div class="explanation">
                  Walkway clearance: <strong>${item.clearance} cm</strong> left over.
                </div>
              </div>

              <div class="viewer-box">
                <model-viewer 
                  src="${item.model_url}" 
                  alt="${item.name}" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  shadow-intensity="1" 
                  auto-rotate>
                  <button slot="ar-button" class="ar-btn">📱 VIEW IN AR</button>
                </model-viewer>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = '<div class="empty-state">No furniture fits this small space. Try increasing width or depth!</div>';
      }
    });

    // Auto-run on load
    document.getElementById('recommendForm').dispatchEvent(new Event('submit'));
  </script>
</body>
</html>
